name: 'Linter: all'

on:
  push:
    paths:
      - 'package.json'
      - '*/package.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'tools/**'
      - '.github/workflows/**'
      - '*.md'
      - '.npmrc'
    branches:
      - main
  pull_request:
    paths:
      - 'package.json'
      - '*/package.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'tools/**'
      - '.github/workflows/**'
      - '*.md'
      - '.npmrc'
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
      - name: Run npm install
        run: npm install --workspaces=false
      - name: Run npm lint
        run: npm run lint
      # npm rejects a provenance publish when repository.url doesn't match the
      # repo the release workflow runs in, so every package release.yml
      # publishes has to name it
      - name: Check published packages name this repository
        run: |
          status=0
          for ws in aliases core fetchindex newest oldest parsefiles ranges static; do
            if ! jq -e '.repository.url == "git+https://github.com/cutenode/nodevu.git"' "$ws/package.json" > /dev/null; then
              echo "::error file=$ws/package.json::repository.url must be git+https://github.com/cutenode/nodevu.git"
              status=1
            fi
          done
          exit "$status"
