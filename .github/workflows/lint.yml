name: "Linter: all"

on:
  push:
    paths:
      - 'package.json'
      - '*/package.json'
      - 'biome.json'
      - '.npmrc'
    branches:
      - main
  pull_request:
    paths:
      - 'package.json'
      - '*/package.json'
      - 'biome.json'
      - '.npmrc'
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: current
    - name: Run npm install
      run: npm install -ws
    - name: Run npm lint
      run: npm run lint
    # npm rejects a provenance publish when repository.url doesn't match the
    # repo the release workflow runs in, so every package release.yml
    # publishes has to name it
    - name: Check published packages name this repository
      run: |
        npm pkg get repository.url -w aliases -w core -w fetchindex -w newest -w oldest -w parsefiles -w ranges -w static --json \
          | jq -e 'to_entries | map(select(.value["repository.url"] != "git+https://github.com/cutenode/nodevu.git") | .key) | if length == 0 then true else ("missing or wrong repository.url: " + join(", ") | halt_error) end'
      
