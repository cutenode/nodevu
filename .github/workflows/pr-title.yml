name: 'Linter: PR title'

# PRs are squash-merged, so the title becomes the commit uppt reads to pick the
# next version
on:
  pull_request:
    # synchronize too, so the required check reports on every push
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
  # the ruleset requires this check, so it reports on merge queue groups too,
  # where the job is skipped, which counts as passing: each PR in a group
  # already passed, and a group has no title to read
  merge_group:

permissions: {}

jobs:
  conventional-commit:
    # uppt titles its release PRs with the bare version (`v1.1.1`)
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the PR title
    steps:
      - name: Check the PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
