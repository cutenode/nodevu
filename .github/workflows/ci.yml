name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # a PR or push only tests what it changed, while dependencies float and Node
  # keeps releasing, so test everything once a week too
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# a push run only tests what its own push changed, so pushes to main each get
# their own group; sharing one would let a newer push replace a queued run
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pick the packages whose tests could change: a package's own files, the
  # workspace packages it tests against, and anything shared by all of them
  changes:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the files a PR changes
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      # the filter doesn't run on a manual or scheduled run, which checks everything
      docs: ${{ steps.filter.outputs.docs || 'true' }}
      workflows: ${{ steps.filter.outputs.workflows || 'true' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find changed packages
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - '.c8rc.json'
              - '.npmrc'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            aliases: [*shared, 'aliases/**']
            core: [*shared, 'core/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            fetchindex: [*shared, 'fetchindex/**', 'fixtures/**']
            fixtures: [*shared, 'fixtures/**']
            newest: [*shared, 'newest/**', 'core/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            oldest: [*shared, 'oldest/**', 'core/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            opt: [*shared, 'opt/**']
            parsefiles: [*shared, 'parsefiles/**', 'fixtures/**']
            ranges: [*shared, 'ranges/**', 'core/**', 'aliases/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            static: [*shared, 'static/**', 'core/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            translate: [*shared, 'translate/**', 'ranges/**', 'core/**', 'aliases/**', 'fetchindex/**', 'parsefiles/**', 'fixtures/**']
            # the site shows core's version, which every release bumps
            docs: [*shared, 'docs/**', 'doc-kit.config.mjs', 'core/package.json', '.github/workflows/docs.yml']
            workflows: ['.github/**']
      # a manual or scheduled run tests every workspace that has a coverage script
      - name: List packages to test
        id: packages
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ -z "$CHANGES" ]; then
            packages=$(for ws in $(jq -r '.workspaces[]' package.json); do
              jq -e '.scripts.coverage' "$ws/package.json" > /dev/null && echo "$ws"
            done | jq -Rcs 'split("\n") | map(select(. != ""))')
          else
            packages=$(jq -c --slurpfile root package.json 'map(select(IN($root[0].workspaces[])))' <<< "$CHANGES")
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  # The root config lints every package, so one run covers the whole repo
  lint:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # _typos.toml lists the words it shouldn't flag
      - name: Check spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      # relative links and anchors only; the weekly docs build checks the rest
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path tools/oxlint/anti-slop .
          output: ${{ runner.temp }}/lychee.md
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # no npm cache: npm ci takes seconds, and devEngines in package.json would
          # otherwise switch one on
          package-manager-cache: false
      # knip needs every workspace's dependencies to match binaries like c8
      # in their scripts to the packages that provide them
      - name: Run npm ci
        run: npm ci
      - name: Run npm lint
        run: npm run lint

  # The published types are generated from the JSDoc, and committed since
  # releases pack without installing anything, so check they're current
  types:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # the packages import each other, so link the workspaces
      - name: Run npm ci
        run: npm ci
      - name: Build the types
        run: npm run types
      - name: Check the committed types match the source
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the committed types are out of date, run npm run types and commit the result"
            exit 1
          fi

  test:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        # the LTS lines whose bundled npm meets devEngines; `current` would
        # install the next major's alpha
        node-version: [26, 24]
        # nothing in the modules depends on the platform, so macOS and Windows
        # only run on the weekly and manual runs
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    env:
      PACKAGE: ${{ matrix.package }}
    # Windows' default shell is PowerShell, which doesn't read "$PACKAGE"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Run npm ci -w ${{ matrix.package }}
        run: npm ci -w "$PACKAGE"
      # the weekly run tries 50 times as many random cases per property.
      # --import takes a URL, which a Windows path isn't
      - name: Raise fast-check's runs
        if: github.event_name == 'schedule'
        run: |
          echo "FC_NUM_RUNS=5000" >> "$GITHUB_ENV"
          echo "NODE_OPTIONS=--import=$(node -p 'require("node:url").pathToFileURL("test/fc-num-runs.mjs").href')" >> "$GITHUB_ENV"
      - name: Run npm run coverage -w ${{ matrix.package }}
        run: npm run coverage -w "$PACKAGE"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # a called workflow can't have more permissions than its caller; docs.yml's
    # deploy job only runs on a push or manual run on main
    permissions:
      contents: read
      pages: write
      id-token: write
    # actionlint 1.7.12 rejects the `$/` self-repository form zizmor asks for
    uses: ./.github/workflows/docs.yml # zizmor: ignore[self-repository]

  # zizmor.yml uploads findings to code scanning, which doesn't fail a run, so
  # check the workflows here too. zizmor.yml runs the online audits
  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the image ships shellcheck, which actionlint runs on every `run:` block
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          online-audits: false

  # fails when a PR adds or upgrades to a dependency with a known advisory
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The one check to require on main: path filters skip the other jobs, and a
  # required check that never reports blocks the merge
  ci-ok:
    if: always()
    needs: [changes, lint, types, test, docs, workflows, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
