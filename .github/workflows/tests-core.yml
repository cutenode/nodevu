name: 'Test Suite: core'

on:
  pull_request:
    paths:
      - 'core/**'
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [current, lts/*, lts/-1]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install most recent npm
        run: npm install -g npm
      - name: Run npm install -w core
        run: npm install -w core
      - name: Run npm run coverage -w core
        run: npm run coverage -w core
