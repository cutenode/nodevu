name: 'Test Suite: oldest'

on:
  pull_request:
    paths:
      - 'oldest/**'
      - 'core/**'
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [current, lts/*, lts/-1]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install most recent npm
        run: npm install -g npm
      - name: Run npm install -w oldest
        run: npm install -w oldest
      - name: Run npm run coverage -w oldest
        run: npm run coverage -w oldest
