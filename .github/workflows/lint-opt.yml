name: 'Linter: opt'

on:
  push:
    paths:
      - 'opt/**'
    branches:
      - main
  pull_request:
    paths:
      - 'opt/**'
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    if: github.repository == 'cutenode/nodevu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
      - name: Run npm install -w opt --include-workspace-root
        run: npm install -w opt --include-workspace-root
      - name: Run npm run lint -w opt
        run: npm run lint -w opt
