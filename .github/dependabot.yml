version: 2

updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/aliases'
      - '/core'
      - '/fetchindex'
      - '/fixtures'
      - '/newest'
      - '/oldest'
      - '/opt'
      - '/parsefiles'
      - '/ranges'
      - '/static'
      - '/translate'
    schedule:
      interval: weekly
    # skip releases younger than a week; security updates ignore this
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # doc-kit's packages share @doc-kit/core's configuration, so they move together: bumped
      # alone, one nests a second core that never gets configured, and the docs build fails
      doc-kit:
        patterns: ['@doc-kit/*']
      # one PR per dependency, however many packages use it
      npm:
        group-by: dependency-name
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
